<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="23" stroke="currentColor" stroke-width="1"/>
          <path d="M14 32c3-6 3-12 0-18M24 32c3-8 3-10 0-18M34 32c3-6 3-12 0-18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span>{{ .Site.Title }}</span>
    </div>

    <nav class="site-footer__nav" aria-label="Footer">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>

    <p class="site-footer__fine">&copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.</p>
  </div>
</footer>
<script src="{{ "js/site.js" | relURL }}" defer></script>
