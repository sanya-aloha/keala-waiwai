<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <span class="brand__mark" aria-hidden="true">
        <img src="{{ "images/logo.png" | relURL }}" width="32" height="32" alt="">
      </span>
      <span>{{ .Site.Title }}</span>
    </div>

    <nav class="site-footer__nav" aria-label="Footer">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>

    <address class="site-footer__address">
      {{ .Site.Params.addressLine1 }}<br>
      {{ .Site.Params.addressLine2 }}
    </address>

    <p class="site-footer__fine">&copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.</p>
  </div>
</footer>
<script src="{{ "js/site.js" | relURL }}" defer></script>
