<header class="site-header" id="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }} home">
      <span class="brand__mark" aria-hidden="true">
        <svg width="34" height="34"><use href="#icon-crest"/></svg>
      </span>
      <span class="brand__word">{{ .Site.Title }}</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="mobile-nav" id="mobile-nav">
    <ul>
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </div>
</header>
